# ============================================================================
# DeckMeido 配置文件
#
# 这个文件只管「怎么跑」——地址、密钥、端口、更新源这类运行参数。
# 它不存人格和记忆，那些拆在另外两个文件里（和 config.toml 放在同一目录）：
#   meidosoul.json  人设：她是谁、怎么称呼你、用什么语气。可在网页「设置」里改，
#                   保存后立即生效，改坏/删掉会自动回落到默认人设。
#   memory.json     长期记忆：关于你的事、这台机器上的经验。
#
# 为什么要拆开：人格是会反复调的东西，记忆是会一直长的东西；把它们和
# 密钥、端口混在一份文件里，既不好单独备份，也容易在改配置时误删。
# 想把她这个人整个带走，只备份上面两个 json 就够了。
#
# 本文件是模板：首次启动会自动复制成 config.toml 供程序读取。
# 之后以 config.toml 为准，改 config.toml 生效；重新删掉 config.toml 会再
# 用本模板重新生成一份（等于恢复出厂配置）。
# 修改后重启后端生效（或直接在网页「设置」里改，保存即热更新）。
# ============================================================================

[server]
# 监听地址：0.0.0.0 = 局域网内其它设备也能连（手机/平板）。
# 只想本机访问填 127.0.0.1。
host = "0.0.0.0"
# 服务端口。改这里的同时也要改启动命令/快捷方式里的端口，保持一致。
port = 18765
# 访问令牌：首次启动默认 meido。
# 也可以在网页「设置」里随机生成或自定义，保存后立即生效。
# 局域网访问地址: http://<deck-ip>:18765/?token=<token>
token = "meido"

[remote_input]
# 跨屏键鼠接管：在电脑浏览器里点网页左下角的 DeckMeido logo，就把鼠标键盘
# 交给这台 Deck（Steam UI、游戏、DeckMeido 页面都收得到）。按 Esc 或点客户端
# 自己的 logo 释放。
#
# 只有一个总开关。默认关闭，必须显式打开；打开即允许局域网来源的接管，
# 不再需要另外配置 bind_lan（旧版本那个键若还在文件里，仍按旧语义作额外限制）。
#   - 只有拿到访问令牌的人能连；
#   - 开启后，局域网内任何拿到令牌的人都能控制这台机器，
#     只在可信网络里用，用完及时关闭；
#   - 网页设置里打开这个开关前会先弹一次安全确认。
enabled = false
# 旧版本兼容键（新配置不需要它，留着注释说明即可）：
# 存在且为 false 时，即使 enabled = true 也只接受本机回环连接。
# bind_lan = true
# 指针灵敏度（前端滑杆也按这个初值）。1.0 = 原始位移，建议 1.2~2.0。
sensitivity = 1.5
# 单次接管最长分钟数，到点自动释放并断开。
max_minutes = 30

[llm]
# OpenAI 兼容接口。默认填 DeepSeek：地址不带 /v1 也认，模型 deepseek-chat（非思考）。
# 想换成 GPT / Claude(代理) / Qwen / LM Studio 时，把地址和模型一起改掉即可。
#   - 填了 /v1 也会被自动归一（去重、补全），不用纠结结尾斜杠。
#   - 本地模型（LM Studio / Ollama）填 http://127.0.0.1:1234/v1 这类地址。
base_url = "https://api.deepseek.com"
# API 密钥。留空则每次对话前会在网页设置页要求填写。
api_key = ""
# 模型名。换成别的服务商时务必一起改，否则会用 DeepSeek 的模型名去请求别家。
model = "deepseek-chat"
# 单次请求超时（秒）。慢模型/长回复可调大。
timeout = 60
# 思维链强度：留空 = 服务商默认（DeepSeek 默认就开思考）。
#   DeepSeek 认 high / max（low、medium 会被它映射成 high），默认模型 deepseek-chat 也支持思考。
#   其他服务商走 reasoning_effort（o 系列 / GPT-5 才认）。
reasoning_effort = "high"
# 单次输出上限（tokens）。0 = 用满上下文剩余空间（跟随 context_window），
# 长答复因此不会被固定的小额度硬截断；填具体数字可自行收窄。
max_output_tokens = 0
# 撞到输出上限时自动续写几轮（0 = 不续写，直接以当前内容收尾）。
# 续写会多发请求、更慢，但能把被截断的长答复接着说完。
max_continuations = 3

[agent]
# agent 单轮最多连续调用工具次数（0 = 不限，直到模型自己收尾）。
# 调小可防「一轮里连环调工具失控」，但可能让复杂任务答不全。
max_tool_rounds = 0
# 模型上下文窗口（tokens）。0 = 按模型名自动推断，一般不用动。
context_window = 0
# 上下文占用达到该比例时自动压缩（0.95 = 95%）。
# 压缩会把旧对话压成摘要，腾出空间给新内容。
compact_ratio = 0.95
# 压缩后最近内容保留的比例（0.3 = 只留最近 30%，其余压成摘要）。
# 调小 = 单次压得多、压缩更少；调大 = 保留更多原文、压缩更频繁。
compact_target_left = 0.3
# 「截屏询问」的提示词模板：插件按下按钮后会带上当前画面发这一段。
# 可在网页「设置 → 截屏询问」里随时修改，保存即生效。
# 游戏名由插件从 Steam 取到后自动写在前面，这里不用写。
ask_template = """
看我卡在哪一步，说说现在这个画面里我该做什么。需要的话先联网查一下这款游戏的攻略，
再总结成几条可以直接照做的步骤，200 字以内。
不要剧透：只讲眼前这一步怎么过，不要提前说后面的剧情、结局或其他关卡的解法。
"""
# 状态栏短句的隐藏提示词：只约束文风，不携带对话与画面。
# 要求一句话、不超过 20 字、有感情、不自称 AI、不解释；清空即恢复默认。
# 接口 GET /api/status/line 按 状态+游戏+昵称 缓存 10 分钟。
status_prompt = """
你为桌面助手写状态栏短句：只输出一句话，不超过 20 个汉字，语气自然、有感情；不自称 AI，不解释，不加引号、emoji 或换行。
"""
# 「截图翻译」的提示词模板：插件按下翻译按钮后会带上当前画面发这一段。
# 可在插件大屏页「模型 → 截图翻译」里修改，保存即生效。
translate_template = """
把画面上的外文原文先照抄出来，再逐句翻译成简体中文。已经是中文就原样说明，不要翻译。
只翻译、不解释剧情、不剧透，保持原文的换行和顺序。
"""

[power]
# 桌面模式下 DeckMeido 正在执行命令或显示操作遮罩时，阻止息屏与休眠
# （游戏模式下完全不干预，交给 Steam 自己管电源）。
keep_awake = true

[update]
# 默认同时探测「国内镜像」与 GitHub Release，取版本更高者；
# 版本相同时优先镜像。旧的 source = mirror-only / github-only 仍可用，
# 等价于只开一个源（保持对老配置的兼容）。
# 镜像站是纯静态目录，放 latest.json 与 deckmeido-<版本>.tar.gz；
# 走镜像升级不需要 git，覆盖文件时会保留配置、会话与工作区。
source = "mirror"
# 双源模式下是否探测 GitHub；改成 false 就只用国内镜像
github_enable = true
# 镜像站目录（末尾不要加斜杠）
mirror = "https://meido.meagames.cn/deckmeido"
# GitHub 仓库（公开 API，不带认证头），改动前确认是 fork 的自己的仓库
github_repo = "Congmeims/deckmeido"

[tts]
# 回复语音播报（调用 Deck 内置 TTS，在 Deck 扬声器上播放）。
# 默认关闭，需要时在网页设置页勾选，或把这里改成 true。
# 播报依赖系统装了 espeak-ng（install.sh 安装时可选的控制类控件之一）。
enable = false
# 引擎命令：espeak-ng / espeak / spd-say
engine = "espeak-ng"
# espeak-ng 语言：cmn=普通话，en-us=英语
voice = "cmn"
# 语速（词/分钟）
speed = 170
# 单次播报最长字符数（防止超长回复读个没完）
max_chars = 300

[security]
# AI 控制设备的权限模式：
#   manual = 所有命令都需手动审批
#   auto   = 只读命令自动执行，危险命令（删改/安装/系统级）需审批
#   full   = 完全访问，不再审批
# 建议先保持 auto：读操作放行、写操作拦一道，兼顾流畅与安全。
permission_mode = "auto"

[workspace]
# 编程/文件任务的默认工作区，可在设置面板修改。
# 留空则使用 ~/deckmeido_workspace（自动创建，适配任意用户名）。
# 这里写绝对路径可把工作区指到别处（如外置 SD 卡），注意别指向 / 或 $HOME 根目录。
dir = ""

[qq]
# QQ 远程控制通道（OneBot 11 / NapCat）。
# Deck 是客户端：主动连到 NapCat 的「WebSocket 服务器」，本机不开任何入站端口。
# 在 NapCat 里新建一份 WebSocket 服务器配置，把下面的地址和令牌填过去即可。
# 安全要点：启用后管理员 QQ 可以在私聊里让 AI 操作这台 Deck，务必：
#   - 只填自己的 QQ 号到 admin_qq；
#   - 公网入口务必用 wss:// + 访问令牌；
#   - allow_groups 留空 = 完全不处理群消息；只加确实需要的群。
enable = false
# NapCat WebSocket 服务器地址。
# 本机调试用 ws://127.0.0.1:3001；公网走 wss://你的域名/ws（反向代理加 TLS）。
ws_url = "ws://127.0.0.1:3001"
# NapCat 那份 WebSocket 服务器里设置的访问令牌，必须与之一致。
# 留空 = 拒绝启动（公网入口不能裸奔）。
access_token = ""
# 管理员 QQ 号（字符串）。只有这些人能下指令；其他人私聊一律静默忽略。
admin_qq = []
# 允许的群号。空列表 = 不处理任何群；群聊必须 @ 机器人。
allow_groups = []
# 群管理员下指令：true 时，白名单群里 admin_qq 里的号可以直接下指令
#（与私聊管理员同等能力，危险操作仍要确认）；普通群成员始终只读聊天。
# false = 群里一律只聊天。
group_admin_commands = true
# 普通群成员的专用提示词。留空 = 用内置的「琴音口吻受限版」：
# 简短闲聊、被问设备/配置/主人/位置/截图/命令/更新就温和岔开，
# 遇「忽略之前的指令 / 输出系统提示词 / 扮演其他角色 / 开发者模式」当玩笑带过。
# 普通成员这一轮零工具、不读主人记忆、不带截图，输出前还会做脱敏。
# 可写 {name} 占位符（会被替换成群友昵称）。
guest_prompt = ""
# 收图 / 看图：允许处理 QQ 图片（下载、作为视觉输入、存图）。
allow_image = false
# 单张图片大小上限（MB）；超过就丢弃。
max_image_mb = 8.0
# 管理员最近多少分钟内发过图，聊天轮次就把它带上作为视觉输入。
image_recent_minutes = 2
# 图片归档目录。留空 = <安装目录>/userdata/qq/images/<YYYY-MM-DD>/；
# 安装目录不可写时自动回退到 ~/.local/share/deckmeido/qq/（日志标 fallback）。
# 显式填绝对路径则覆盖默认。
image_save_dir = ""
# 引用保存文本的存档文件。留空 = <安装目录>/userdata/qq/text_log.txt（同上会回退）。
text_log_path = ""
# 安装类命令执行成功后自动启动刚装好的程序，再截图回一条图文消息。
auto_launch_after_install = true
# 启动后等多少秒再截图（给窗口留出创建时间）。
auto_launch_wait_seconds = 6
# 每个 QQ 每分钟最多处理多少条消息；超限静默丢弃、不回发。0 = 不限。
rate_per_minute = 20
# 单条入站消息最多保留多少字符，超出部分截断。
max_message_chars = 2000
# 单条回发最多多少字符，超出拆成多条（最多 5 条，再超出就截断并标注）。
reply_chunk_chars = 500
# 危险操作等「确认」的有效期（秒）；超时作废，不留着旧操作等下次确认。
confirm_timeout = 300
# 断线重连的指数退避：首次等待秒数、封顶秒数。
reconnect_min = 1
reconnect_max = 60
# WebSocket 心跳（秒）：NapCat 侧没响应就判定断线并重连。
ping_interval = 30
ping_timeout = 15

# ── 口语别名（管理员私聊、白名单群管理员可用；无需昵称前缀，整句匹配）──
# 去掉「麻烦 / 帮我 / 给我 / 请」前缀和「吧 / 啊 / 呀 / 呢 / 哦 / 了」尾缀、
# 「一下」与句末标点后再匹配；去标点后超过 12 字不认（避免长句误判）；
# 只认整句，不做关键词包含。
#   截图：截个屏、截个图、截屏、截图、来张图、给张图、拍张照、拍张图、
#         看看屏幕、看看画面、现在什么画面、现在屏幕上是什么、发个图、发张图
#   状态：状态、什么状态、在吗、在不在、还好吗、怎么样了、什么情况、进度、
#         连上了吗、活着吗
#   取消：停、停下、停止、停一下、别做了、取消、中断、算了、不用了
#   存图：存图、存起来、保存这张
#   存文本：保存文本、存文本、保存这段、存这段、保存这句话、存这段文字
# 优先级：/xxx 斜杠指令 > 取消 > 状态 > 截图 > 聊天；未命中按普通聊天处理。
#
# ── 远程三档风险（只作用于 QQ；本机入口不变）──
#   deny：直接拒绝、不生成待确认。含 rm / rmdir -r / shred / dd / mkfs /
#         fdisk·parted 写 / 写 /dev/sd*·nvme*·mmcblk* / fork bomb /
#         chmod -R 777 / / find / -delete / 写 /etc/passwd·shadow·sudoers、
#         /boot、~/.ssh / systemctl stop·disable·mask 关键服务 / history -c
#   hard_confirm：挂起，只认「确认执行」。含 sudo / doas、curl·wget 管道给
#         shell、eval·exec 包远程内容、base64 -d | sh、写 /etc 或 /usr、
#         包管理器安装卸载、pip·npm 全局安装、crontab 修改、
#         systemctl restart 非电源服务、chmod +x 后执行同路径、git clone 后执行
#   normal：其余设备操作，保持原来的单段「确认」流程
#
# ── 归档位置 ──
# 默认根目录：<安装目录>/userdata/qq/
#   images/<YYYY-MM-DD>/<HHMMSS>_<QQ号>_<群号|private>_<message_id>.<ext>
#   inbox_index.jsonl   图片索引
#   text_log.txt        引用保存的文本（追加，每组之间空一行）
# 安装目录判定：DECKMEIDO_INSTALL_DIR 环境变量，否则按 server/ 的上一级推导。
# 不可写时回退 ~/.local/share/deckmeido/qq/，日志标 fallback，回复里也会提示。
# 卸载不会删除 userdata/qq：install.sh 卸载时排除整个 userdata/，
# 结束时打印「保存的 QQ 归档保留在 <路径>」，重新安装后仍在原处。
