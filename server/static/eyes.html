<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DeckMeido · 智能音箱</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { cursor: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  /* 「我在」：唤醒瞬间出现的字幕。合成失败时只剩这一行，流程不受影响。 */
  #caption {
    position: fixed; left: 50%; top: 62%; transform: translate(-50%, 0);
    margin: 0; color: rgba(255,255,255,.92);
    font: 600 clamp(18px, 2.3vmin, 30px)/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .22em; text-indent: .22em; white-space: nowrap;
    opacity: 0; transition: opacity .22s ease; pointer-events: none;
  }
  #caption.on { opacity: 1; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 26px; display: flex; gap: 14px;
    justify-content: center; align-items: center; opacity: 0; pointer-events: none;
    transition: opacity .25s ease; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #hint.on { opacity: 1; pointer-events: auto; }
  #hint button {
    background: rgba(255,255,255,.09); color: #fff; border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px; padding: 7px 16px; font: inherit; letter-spacing: .04em;
    cursor: pointer;
  }
  #hint button:hover { background: rgba(255,255,255,.16); }
  #hint span { color: rgba(255,255,255,.42); font-size: 12px; }
  /* 只用于「和后端断开」这类连接提示，不用红字、不报错误详情。 */
  #notice {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
    color: rgba(255,255,255,.5); font: 13px/1.6 system-ui, sans-serif; text-align: center;
    opacity: 0; transition: opacity .3s ease; pointer-events: none; max-width: 80vw;
  }
  #notice.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<p id="caption"></p>
<div id="notice"></div>
<div id="hint">
  <button id="stop">停止</button>
  <button id="exit">退出</button>
  <span>Esc 停止 · 空闲时 Esc 退出</span>
</div>
<script>
(() => {
  "use strict";
  const cv = document.getElementById("stage");
  const ctx = cv.getContext("2d", { alpha: false });
  const hint = document.getElementById("hint");
  const notice = document.getElementById("notice");
  const caption = document.getElementById("caption");
  const STOP = document.getElementById("stop");
  const EXIT = document.getElementById("exit");

  const WHITE = "255,255,255";

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  const state = {
    name: "disarmed", level: 0, levelSmooth: 0, ackText: "我在",
    offline: false, wakeStart: 0, captionUntil: 0, drawnName: "",
    nextBlink: 0, blinkStart: 0, blinking: false,
  };

  // ---- 状态轮询：只读，不含音频 ----
  function applyStatus(d) {
    state.name = d.state || "disarmed";
    state.level = Number(d.level) || 0;
    state.ackText = (d.ack && d.ack.text) || "我在";
    state.offline = false;
  }

  async function poll() {
    try {
      const r = await fetch("/api/wake/state", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      applyStatus(await r.json());
    } catch (e) {
      state.offline = true;
    }
    setTimeout(poll, state.offline ? 1500 : 250);
  }
  poll();

  // 轮询之外再挂一条 /ws：唤醒命中时状态切换要和「我在」同时发生，
  // 不能等到下一次轮询。鉴权失败或被关掉时静默退回轮询。
  let ws = null;
  function connectWS() {
    if (ws) return;
    const proto = location.protocol === "https:" ? "wss" : "ws";
    try { ws = new WebSocket(proto + "://" + location.host + "/ws"); } catch (e) { ws = null; return; }
    ws.onopen = () => {
      try { ws.send(JSON.stringify({ type: "ping" })); } catch (e) {}
    };
    ws.onmessage = (ev) => {
      // /ws 建连时会先推一大段 history；先做字符串过滤，避免解析整段历史
      if (!ev.data || ev.data.indexOf('"wake_state"') === -1) return;
      try {
        const m = JSON.parse(ev.data);
        if (m && m.type === "wake_state" && m.data) applyStatus(m.data);
      } catch (e) {}
    };
    ws.onclose = (ev) => {
      ws = null;
      // 4401 = 未配对：这条连接重连多少次都没用，继续用轮询即可
      if (ev && ev.code === 4401) return;
      setTimeout(connectWS, 2500);
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }
  connectWS();
  setInterval(() => {
    if (ws && ws.readyState === 1) {
      try { ws.send(JSON.stringify({ type: "ping" })); } catch (e) {}
    }
  }, 25000);

  // ---- 交互：鼠标/触摸移动才显示按钮 ----
  let hintTimer = 0;
  function reveal() {
    hint.classList.add("on");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hint.classList.remove("on"), 3500);
  }
  window.addEventListener("mousemove", reveal);
  window.addEventListener("touchstart", reveal, { passive: true });

  async function post(path) {
    try {
      const r = await fetch(path, { method: "POST", cache: "no-store" });
      return r.ok;
    } catch (e) { return false; }
  }
  STOP.addEventListener("click", async (e) => {
    e.stopPropagation();
    await post("/api/wake/stop");
    reveal();
  });
  EXIT.addEventListener("click", (e) => {
    e.stopPropagation();
    leave();
  });
  async function leave() {
    await post("/api/wake/exit");
    // 由客户端 urlChanged 收回全屏；浏览器里则直接回主控制台
    location.replace("/?native=1");
  }
  window.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    e.preventDefault();
    // 有正在进行的轮次（含刚唤醒播「我在」）先停；已经空闲就退出模式
    if (["waking", "listening", "thinking", "speaking"].includes(state.name)) {
      post("/api/wake/stop");
    } else {
      leave();
    }
  });
  // 双击空白处也可以退出，作为手柄/触屏的兜底入口
  window.addEventListener("dblclick", leave);

  // ---- 简笔画工具：全部是白色粗圆头笔画，没有渐变/发光/阴影 ----
  function sketch(pts) {
    const n = pts.length;
    if (n < 2) return;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }

  function stroke(pts, width, alpha) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = "rgb(" + WHITE + ")";
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    sketch(pts);
  }

  // 极轻的手绘抖动：低频、幅度不超过 1.2px，绝不闪烁
  function wob(seed, t, amp) {
    return {
      x: Math.sin(t * 0.8 + seed * 1.7) * amp,
      y: Math.cos(t * 0.62 + seed * 2.3) * amp * 0.8,
    };
  }

  function eyeDot(x, y, r, squash, seed, t, alpha) {
    const w = wob(seed, t, 1.0);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgb(" + WHITE + ")";
    ctx.beginPath();
    ctx.ellipse(x + w.x, y + w.y, r, Math.max(r * 0.05, r * squash), 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function eyeDash(x, y, r, seed, t, alpha) {
    const len = r * 1.5, th = r * 0.30;
    const w = wob(seed, t, 1.1);
    stroke([
      [x - len / 2 + w.x, y + w.y - 0.6],
      [x - len * 0.12 + w.x, y + w.y + 0.4],
      [x + len / 2 + w.x, y + w.y - 0.2],
    ], th, alpha);
  }

  function eyeCaret(x, y, r, scale, seed, t, alpha) {
    const s = r * 0.92 * scale;
    const w = wob(seed, t, 0.9);
    stroke([
      [x - s + w.x, y + s * 0.52 + w.y],
      [x + w.x, y - s * 0.58 + w.y],
      [x + s + w.x, y + s * 0.52 + w.y],
    ], r * 0.26, alpha);
  }

  function eyeSpiral(x, y, r, dir, seed, t, alpha) {
    const w = wob(seed, t, 1.2);
    const turns = 2.6, total = turns * Math.PI * 2;
    const pts = [];
    for (let a = 0; a <= total; a += 0.22) {
      const k = a / total;
      const rad = r * (0.10 + 0.90 * k);
      // 手绘圈圈：半径带一点点周期性起伏，不是一个数学完美的螺旋
      const rough = 1 + 0.045 * Math.sin(a * 3 + seed);
      pts.push([
        x + w.x + Math.cos(a * dir) * rad * rough,
        y + w.y + Math.sin(a * dir) * rad * rough,
      ]);
    }
    stroke(pts, r * 0.20, alpha);
  }

  function mouthDot(x, y, r, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgb(" + WHITE + ")";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function mouthBlock(x, y, r, open, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgb(" + WHITE + ")";
    ctx.beginPath();
    ctx.ellipse(x, y, r * 0.58, r * (0.10 + 0.46 * open), 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function mouthEllipsis(x, y, r, t, alpha) {
    for (let i = -1; i <= 1; i++) {
      const pulse = alpha * (0.42 + 0.20 * Math.sin(t * 2.2 + i * 1.1));
      mouthDot(x + i * r * 0.52, y, r * 0.13, pulse);
    }
  }

  // 眨眼压缩：圆点眼短暂压成一条短弧，再平滑张开
  function blinkSquash(t) {
    const now = t * 1000;
    if (!state.nextBlink) state.nextBlink = now + 2600 + Math.random() * 3400;
    if (!state.blinking && now >= state.nextBlink) {
      state.blinking = true;
      state.blinkStart = now;
      state.nextBlink = now + 2800 + Math.random() * 3600;
    }
    if (!state.blinking) return 1;
    const p = (now - state.blinkStart) / 170;
    if (p >= 1) { state.blinking = false; return 1; }
    return 1 - Math.sin(Math.PI * Math.max(0, Math.min(1, p))) * 0.93;
  }

  let lastFrame = 0;
  function frame(tms) {
    requestAnimationFrame(frame);
    const t = tms / 1000;
    const dt = Math.min(0.05, t - (lastFrame || t));
    lastFrame = t;
    state.levelSmooth += (state.level - state.levelSmooth) * Math.min(1, dt * 9);

    // 状态切换：被唤醒的瞬间记下时间，供「一惊」动画和「我在」字幕使用
    if (state.name !== state.drawnName) {
      if (state.name === "waking") {
        state.wakeStart = t;
        state.captionUntil = tms + 1600;
      }
      state.drawnName = state.name;
    }

    ctx.globalAlpha = 1;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    const s = Math.min(W, H);
    const margin = Math.max(32, s * 0.08);
    const eyeR = Math.max(14, Math.min(s * 0.062, (W / 2 - margin) / 4.2, H * 0.09));
    const gap = eyeR * 3.2;
    const cx = W / 2;
    let cy = H * 0.42;
    const breathe = Math.sin(t * (state.name === "disarmed" ? 0.42 : 0.55));
    let faceScale = 1 + breathe * 0.012;
    cy += breathe * (s * 0.003);

    // ---- 每个状态只用一组符号，整组替换，不做变形滤镜 ----
    let expr = "dash";
    let alpha = 0.9;
    let inward = 0;
    let gazeX = 0, gazeY = 0;
    let mouth = null;
    let blinkable = false;

    switch (state.name) {
      case "disarmed":
        expr = "dash"; alpha = 0.34;
        break;
      case "armed":
        expr = "dash"; alpha = 0.82;
        break;
      case "waking": {
        expr = "caret";
        alpha = 1;
        const age = Math.max(0, t - state.wakeStart);
        const p = Math.min(1, age / 0.34);
        // 很短的「一惊」：整体放大到 1.2 再回落，同时轻轻向上一跳
        const pop = Math.sin(p * Math.PI);
        faceScale += pop * 0.22;
        cy -= pop * eyeR * 0.55;
        break;
      }
      case "listening":
        expr = "dot"; alpha = 1;
        inward = eyeR * 0.14;
        mouth = "dot";
        blinkable = true;
        break;
      case "thinking":
        expr = "dot"; alpha = 0.96;
        gazeX = Math.sin(t * 0.45) * eyeR * 0.72;
        gazeY = -eyeR * 0.50 + Math.cos(t * 0.31) * eyeR * 0.14;
        mouth = "ellipsis";
        break;
      case "speaking": {
        expr = "dot"; alpha = 1;
        const open = Math.max(0, Math.min(1,
          0.42 + 0.24 * Math.sin(t * 8.5) + Math.min(0.5, state.levelSmooth * 1.6)));
        mouth = { open };
        blinkable = true;
        break;
      }
      case "error":
        expr = "spiral"; alpha = 0.82;
        break;
      default:
        expr = "dash"; alpha = 0.3;
    }

    const squash = blinkable ? blinkSquash(t) : 1;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(faceScale, faceScale);
    ctx.translate(-cx, -cy);

    const lx = cx - gap + inward;
    const rx = cx + gap - inward;

    if (expr === "dash") {
      eyeDash(lx, cy, eyeR, 0.7, t, alpha);
      eyeDash(rx, cy, eyeR, 2.4, t, alpha);
    } else if (expr === "caret") {
      eyeCaret(lx, cy, eyeR, 1, 0.7, t, alpha);
      eyeCaret(rx, cy, eyeR, 1, 2.4, t, alpha);
    } else if (expr === "spiral") {
      eyeSpiral(lx, cy, eyeR * 1.02, 1, 0.7, t, alpha);
      eyeSpiral(rx, cy, eyeR * 1.02, -1, 2.4, t, alpha);
    } else {
      eyeDot(lx + gazeX, cy + gazeY, eyeR * 0.55, squash, 0.7, t, alpha);
      eyeDot(rx + gazeX, cy + gazeY, eyeR * 0.55, squash, 2.4, t, alpha);
    }

    const my = cy + eyeR * 2.0;
    if (mouth === "dot") {
      mouthDot(cx, my, eyeR * 0.15, alpha * 0.8);
    } else if (mouth === "ellipsis") {
      mouthEllipsis(cx, my, eyeR, t, alpha * 0.9);
    } else if (mouth && mouth.open !== undefined) {
      mouthBlock(cx, my, eyeR, mouth.open, alpha);
    }
    ctx.restore();

    // ---- 「我在」字幕：唤醒时出现；合成失败也照样显示 ----
    const nowMs = tms;
    const showCaption = (state.name === "waking" || nowMs < state.captionUntil)
      && state.name !== "error";
    if (showCaption) caption.textContent = state.ackText;
    caption.classList.toggle("on", showCaption && !state.offline);

    // ---- 连接提示：只有断线，不显示错误详情 ----
    notice.classList.toggle("on", state.offline);
    if (state.offline) notice.textContent = "与后端断开，正在重连…";
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
