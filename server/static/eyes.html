<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DeckMeido · 智能音箱</title>
<script>
  // 先挂主题再解析样式，避免浅色主题下进页面时闪一帧深色底
  (function () {
    var t = null;
    try { t = localStorage.getItem("deckmeido_theme"); } catch (e) {}
    if (t !== "light" && t !== "dark" && t !== "oled") t = "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* 三档主题与主界面同名、同顺序：浅色 / 深色 / 暗黑（纯黑取向）。
     --face 只给 canvas 读取（Canvas 不认 var()，由脚本读出来再用），
     其余变量给字幕和按钮用，切主题时整页一起换。 */
  :root {
    --bg: #0f1117;
    --face: #ffffff;
    --caption: rgba(232,234,240,.92);
    --btn-bg: rgba(255,255,255,.09);
    --btn-bg-hover: rgba(255,255,255,.16);
    --btn-fg: #ffffff;
    --btn-line: rgba(255,255,255,.28);
    --hint-fg: rgba(255,255,255,.42);
    --notice: rgba(255,255,255,.5);
    color-scheme: dark;
  }
  [data-theme=light] {
    --bg: #ffffff;
    --face: #1c2333;
    --caption: rgba(28,35,51,.92);
    --btn-bg: rgba(16,24,40,.06);
    --btn-bg-hover: rgba(16,24,40,.12);
    --btn-fg: #1c2333;
    --btn-line: rgba(16,24,40,.18);
    --hint-fg: rgba(16,24,40,.42);
    --notice: rgba(16,24,40,.5);
    color-scheme: light;
  }
  [data-theme=oled] {
    --bg: #000000;
    --face: #ffffff;
    --caption: rgba(255,255,255,.92);
    --btn-bg: rgba(255,255,255,.07);
    --btn-bg-hover: rgba(255,255,255,.14);
    --btn-fg: #ffffff;
    --btn-line: rgba(255,255,255,.24);
    --hint-fg: rgba(255,255,255,.4);
    --notice: rgba(255,255,255,.48);
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { cursor: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  /* 「我在」：唤醒瞬间出现的字幕。合成失败时只剩这一行，流程不受影响。 */
  #caption {
    position: fixed; left: 50%; top: 62%; transform: translate(-50%, 0);
    margin: 0; color: var(--caption);
    font: 600 clamp(18px, 2.3vmin, 30px)/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .22em; text-indent: .22em; white-space: nowrap;
    opacity: 0; transition: opacity .22s ease; pointer-events: none;
  }
  #caption.on { opacity: 1; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 26px; display: flex; gap: 14px;
    justify-content: center; align-items: center; opacity: 0; pointer-events: none;
    transition: opacity .25s ease; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #hint.on { opacity: 1; pointer-events: auto; }
  #hint button {
    background: var(--btn-bg); color: var(--btn-fg); border: 1px solid var(--btn-line);
    border-radius: 999px; padding: 7px 16px; font: inherit; letter-spacing: .04em;
    cursor: pointer;
  }
  #hint button:hover { background: var(--btn-bg-hover); }
  #hint span { color: var(--hint-fg); font-size: 12px; }
  /* 只用于「和后端断开」这类连接提示，不用红字、不报错误详情。 */
  #notice {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
    color: var(--notice); font: 13px/1.6 system-ui, sans-serif; text-align: center;
    opacity: 0; transition: opacity .3s ease; pointer-events: none; max-width: 80vw;
  }
  #notice.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<p id="caption"></p>
<div id="notice"></div>
<div id="hint">
  <button id="stop">停止</button>
  <button id="exit">退出</button>
  <span>Esc 停止 · 空闲时 Esc 退出</span>
</div>
<script>
(() => {
  "use strict";
  const cv = document.getElementById("stage");
  const ctx = cv.getContext("2d", { alpha: false });
  const hint = document.getElementById("hint");
  const notice = document.getElementById("notice");
  const caption = document.getElementById("caption");
  const STOP = document.getElementById("stop");
  const EXIT = document.getElementById("exit");

  // ---- 主题：和主界面共用 localStorage 里的 deckmeido_theme ----
  // Canvas 不认识 CSS 变量，也不接受 "255,255,255" 这种裸三元组，
  // 所以从 :root 的 --bg / --face 读出合法颜色再赋值（修复黑屏的关键）。
  const THEMES = ["light", "dark", "oled"];
  let BG = "#0f1117", FACE = "#e8eaf0";
  function readPalette() {
    const cs = getComputedStyle(document.documentElement);
    BG = (cs.getPropertyValue("--bg") || "").trim() || "#0f1117";
    FACE = (cs.getPropertyValue("--face") || "").trim() || "#e8eaf0";
  }
  function setTheme(t) {
    const name = THEMES.indexOf(t) === -1 ? "dark" : t;
    document.documentElement.setAttribute("data-theme", name);
    readPalette();
  }
  try { setTheme(localStorage.getItem("deckmeido_theme") || "dark"); } catch (e) { setTheme("dark"); }
  // 主界面切主题时，同一个源下的眼睛页收到 storage 事件，立刻跟着换
  window.addEventListener("storage", (e) => {
    if (e.key === "deckmeido_theme") setTheme(e.newValue || "dark");
  });

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  const state = {
    name: "disarmed", level: 0, levelSmooth: 0, ackText: "我在",
    offline: false, wakeStart: 0, captionUntil: 0, drawnName: "",
    nextBlink: 0, blinkStart: 0, blinking: false, idleSleep: false,
  };

  // ---- 防烧屏：全屏常亮的脸在 OLED 上会留残影 ----
  // 5 分钟没有任何交互就闭眼（屏幕基本变黑），15 分钟直接回主界面。
  // 这里只认用户真的动过：鼠标移动 / 触摸 / 按键；状态轮询和语音交互不算，
  // 否则一直有人说话就永远闭不上眼。
  const EYES_IDLE_CLOSE_MS = 5 * 60 * 1000;
  const EYES_IDLE_EXIT_MS = 15 * 60 * 1000;
  let lastActive = Date.now();
  const touchActive = () => { lastActive = Date.now(); };
  window.addEventListener("mousemove", touchActive, { passive: true });
  window.addEventListener("touchstart", touchActive, { passive: true });
  window.addEventListener("keydown", touchActive);
  window.addEventListener("pointerdown", touchActive, { passive: true });

  // ---- 状态轮询：只读，不含音频 ----
  function applyStatus(d) {
    state.name = d.state || "disarmed";
    state.level = Number(d.level) || 0;
    state.ackText = (d.ack && d.ack.text) || "我在";
    state.offline = false;
  }

  async function poll() {
    try {
      const r = await fetch("/api/wake/state", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      applyStatus(await r.json());
    } catch (e) {
      state.offline = true;
    }
    setTimeout(poll, state.offline ? 1500 : 250);
  }
  poll();

  // 轮询之外再挂一条 /ws：唤醒命中时状态切换要和「我在」同时发生，
  // 不能等到下一次轮询。鉴权失败或被关掉时静默退回轮询。
  let ws = null;
  function connectWS() {
    if (ws) return;
    const proto = location.protocol === "https:" ? "wss" : "ws";
    try { ws = new WebSocket(proto + "://" + location.host + "/ws"); } catch (e) { ws = null; return; }
    ws.onopen = () => {
      try { ws.send(JSON.stringify({ type: "ping" })); } catch (e) {}
    };
    ws.onmessage = (ev) => {
      // /ws 建连时会先推一大段 history；先做字符串过滤，避免解析整段历史
      if (!ev.data || ev.data.indexOf('"wake_state"') === -1) return;
      try {
        const m = JSON.parse(ev.data);
        if (m && m.type === "wake_state" && m.data) applyStatus(m.data);
      } catch (e) {}
    };
    ws.onclose = (ev) => {
      ws = null;
      // 4401 = 未配对：这条连接重连多少次都没用，继续用轮询即可
      if (ev && ev.code === 4401) return;
      setTimeout(connectWS, 2500);
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }
  connectWS();
  setInterval(() => {
    if (ws && ws.readyState === 1) {
      try { ws.send(JSON.stringify({ type: "ping" })); } catch (e) {}
    }
  }, 25000);

  // ---- 交互：鼠标/触摸移动才显示按钮 ----
  let hintTimer = 0;
  function reveal() {
    hint.classList.add("on");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hint.classList.remove("on"), 3500);
  }
  window.addEventListener("mousemove", reveal);
  window.addEventListener("touchstart", reveal, { passive: true });

  async function post(path) {
    try {
      const r = await fetch(path, { method: "POST", cache: "no-store" });
      return r.ok;
    } catch (e) { return false; }
  }
  STOP.addEventListener("click", async (e) => {
    e.stopPropagation();
    await post("/api/wake/stop");
    reveal();
  });
  EXIT.addEventListener("click", (e) => {
    e.stopPropagation();
    leave();
  });
  async function leave() {
    await post("/api/wake/exit");
    // 由客户端 urlChanged 收回全屏；浏览器里则直接回主控制台
    location.replace("/?native=1");
  }
  window.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    e.preventDefault();
    // 有正在进行的轮次（含刚唤醒播「我在」）先停；已经空闲就退出模式
    if (["waking", "listening", "thinking", "speaking"].includes(state.name)) {
      post("/api/wake/stop");
    } else {
      leave();
    }
  });
  // 双击空白处也可以退出，作为手柄/触屏的兜底入口
  window.addEventListener("dblclick", leave);

  // 空闲计时：先闭眼，再退出。用 interval 而不是每帧判断，页面被挂起时
  // 恢复后会立刻按真实空闲时长处理——本来就是为了「人走了别再亮着」。
  setInterval(() => {
    const idle = Date.now() - lastActive;
    if (idle >= EYES_IDLE_EXIT_MS) {
      leave();
      return;
    }
    state.idleSleep = idle >= EYES_IDLE_CLOSE_MS;
  }, 1000);

  // ---- 绘制：沿用 ouo-face 校准过的 ω 猫嘴脸 ----
  // 圆点眼、^ 笑眼、> < 眯眼、螺旋晕眩眼，嘴的几何参数三点定圆拟合自原图。
  ctx.fillStyle = ctx.strokeStyle = FACE;

  function drawEye(x, y, r, mode, squash, alpha, t) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    // 待机时轻微呼吸抖动，幅度 < 1px
    const wx = Math.sin(t * 0.8) * 0.8, wy = Math.cos(t * 0.62) * 0.6;
    ctx.translate(wx, wy);

    if (mode === "spiral") {
      // 螺旋眼：阿基米德螺线
      ctx.strokeStyle = FACE;
      ctx.lineWidth = r * 0.32;
      ctx.lineCap = "round";
      ctx.beginPath();
      const turns = 2.2;
      for (let a = 0; a < Math.PI * 2 * turns; a += 0.12) {
        const rr = r * 0.85 * a / (Math.PI * 2 * turns);
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    } else if (mode === "happy") {
      // ^ 弧眼（笑）
      ctx.strokeStyle = FACE;
      ctx.lineWidth = r * 0.38;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(0, r * 0.25, r * 0.85, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    } else if (mode === "squint") {
      // > < 折线
      ctx.strokeStyle = FACE;
      ctx.lineWidth = r * 0.35;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(-r * 0.8, -r * 0.6);
      ctx.lineTo(r * 0.5, 0);
      ctx.lineTo(-r * 0.8, r * 0.6);
      ctx.stroke();
    } else if (mode === "dash" || squash > 0.85) {
      // 闭眼：短横线
      ctx.fillStyle = FACE;
      ctx.fillRect(-r * 0.9, -r * 0.10, r * 1.8, r * 0.22);
    } else {
      // 圆点眼，眨眼时纵向压扁
      ctx.fillStyle = FACE;
      const ry = Math.max(r * (1 - squash), r * 0.10);
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.92, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // ω 猫嘴：两段圆弧描边，圆头。三点定圆拟合自原图，宽高比 2.93:1。
  // 这里固定 1.0 不透明：两瓣的圆头在中缝完全重合，半透明时那一小块会叠两次、
  // 比别处亮（看着像重影）；不透明时后画的圆头直接盖住前一个，接缝均匀。
  // 嘴不跟着整张脸淡出——空闲闭眼时整张脸压到 0.16，靠暗度表达即可。
  function drawCatMouth(cx, cy, w, t) {
    if (w < 2) return;
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.translate(cx, cy);
    const th = w * 0.092;
    const Hh = w / 2.93;
    ctx.strokeStyle = FACE;
    ctx.lineWidth = th;
    ctx.lineCap = "round";
    const r = w * 0.246;
    const a0 = 3.003;
    const toXY = (px, py) => [px * w - w / 2, py * Hh - Hh * 0.5];
    [1, -1].forEach((s) => {
      const nx = s > 0 ? 0.289 : 0.711;
      const [mx, my] = toXY(nx, 0.115);
      const ex = (0.5 - nx) * w;
      const ey = 0.485 * Hh - Hh * 0.5 - my;
      const a1 = Math.atan2(ey, ex);
      ctx.beginPath();
      if (s > 0) ctx.arc(mx, my, r, -a0, a1, true);
      else ctx.arc(mx, my, r, Math.PI + a0, a1, false);
      ctx.stroke();
    });
    ctx.restore();
  }

  // 说话：ω 在开合之间形变——两瓣中心下压、开口放大，模拟嘴部张合
  function drawTalkingMouth(cx, cy, w, open) {
    if (w < 2) return;
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.translate(cx, cy);
    // 开口越大，ω 纵向拉伸并略有横向收窄
    const sy = 1 + open * 0.55;
    ctx.scale(1 - open * 0.06, sy);
    const th = w * 0.092;
    const Hh = w / 2.93;
    ctx.strokeStyle = FACE;
    ctx.lineWidth = th;
    ctx.lineCap = "round";
    const r = w * 0.246;
    const a0 = 3.003;
    const toXY = (px, py) => [px * w - w / 2, py * Hh - Hh * 0.5];
    [1, -1].forEach((s) => {
      const nx = s > 0 ? 0.289 : 0.711;
      const [mx, my] = toXY(nx, 0.115);
      const ex = (0.5 - nx) * w;
      const ey = 0.485 * Hh - Hh * 0.5 - my;
      const a1 = Math.atan2(ey, ex);
      ctx.beginPath();
      if (s > 0) ctx.arc(mx, my, r, -a0, a1, true);
      else ctx.arc(mx, my, r, Math.PI + a0, a1, false);
      ctx.stroke();
    });
    ctx.restore();
  }

  // 眨眼压缩：返回闭眼程度（0 = 睁开，1 = 完全闭上）
  function blinkSquash(t) {
    const now = t * 1000;
    if (!state.nextBlink) state.nextBlink = now + 2600 + Math.random() * 3400;
    if (!state.blinking && now >= state.nextBlink) {
      state.blinking = true;
      state.blinkStart = now;
      state.nextBlink = now + 2800 + Math.random() * 3600;
    }
    if (!state.blinking) return 0;
    const p = (now - state.blinkStart) / 170;
    if (p >= 1) { state.blinking = false; return 0; }
    return Math.sin(Math.PI * Math.max(0, Math.min(1, p))) * 0.95;
  }

  let lastFrame = 0;
  function frame(tms) {
    requestAnimationFrame(frame);
    const t = tms / 1000;
    const dt = Math.min(0.05, t - (lastFrame || t));
    lastFrame = t;
    state.levelSmooth += (state.level - state.levelSmooth) * Math.min(1, dt * 9);

    // 状态切换：被唤醒的瞬间记下时间，供「一惊」动画和「我在」字幕使用
    if (state.name !== state.drawnName) {
      if (state.name === "waking") {
        state.wakeStart = t;
        state.captionUntil = tms + 1600;
      }
      state.drawnName = state.name;
    }

    ctx.globalAlpha = 1;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    const s = Math.min(W, H);
    const margin = Math.max(32, s * 0.08);
    // 与 ouo-face 校准后的比例一致：眼半径 0.065s，眼距 0.21s，嘴宽 = 眼距 × 1.05
    const eyeR = Math.max(10, Math.min(s * 0.065, (W / 2 - margin) / 3.6, H * 0.10));
    const gap = eyeR * 3.23;            // 0.21s / 0.065s ≈ 3.23
    const mouthW = gap * 1.05;
    const cx = W / 2;
    let cy = H * 0.40;
    const breathe = Math.sin(t * (state.name === "disarmed" ? 0.42 : 0.55));
    let faceScale = 1 + breathe * 0.012;
    cy += breathe * (s * 0.003);

    // ---- 每个状态只用一组符号，整组替换，不做变形滤镜 ----
    let expr = "dash";
    // 眼睛固定不透明：之前的半透明让描边端头重叠处叠色，也会显得发虚。
    // 只有「待机」和「空闲闭眼」这两种要呈现暗度的状态才压低 alpha。
    let alpha = 1;
    let inward = 0;
    let gazeX = 0, gazeY = 0;
    let mouthOpen = 0;
    let blinkable = false;

    switch (state.name) {
      case "disarmed":
        // 待机：闭眼横线，偶尔眨一下眼
        expr = "dot"; alpha = 1;
        blinkable = true;
        break;
      case "armed":
        expr = "dot"; alpha = 1;
        blinkable = true;
        break;
      case "waking": {
        // 有人在：一条 ^ 笑眼 + ω 猫嘴
        expr = "happy";
        alpha = 1;
        const age = Math.max(0, t - state.wakeStart);
        const p = Math.min(1, age / 0.34);
        const pop = Math.sin(p * Math.PI);
        faceScale += pop * 0.22;
        cy -= pop * eyeR * 0.55;
        break;
      }
      case "listening":
        // 听：圆点眼，嘴闭合的 ω
        expr = "dot"; alpha = 1;
        inward = eyeR * 0.12;
        blinkable = true;
        break;
      case "thinking":
        // 思考：眼珠游移，嘴保持 ω
        expr = "dot"; alpha = 1;
        gazeX = Math.sin(t * 0.45) * eyeR * 0.72;
        gazeY = -eyeR * 0.50 + Math.cos(t * 0.31) * eyeR * 0.14;
        break;
      case "speaking": {
        // 说话：圆点眼 + ω 随音量开合
        expr = "dot"; alpha = 1;
        blinkable = true;
        const amp = Math.min(1, state.levelSmooth * 2.2);
        mouthOpen = Math.max(0, Math.min(1,
          0.30 + 0.22 * Math.sin(t * 11.0) + 0.18 * Math.sin(t * 7.3 + 1.6) + amp * 0.45));
        break;
      }
      case "error":
        expr = "spiral"; alpha = 1;
        break;
      default:
        expr = "dash"; alpha = 1;
    }

    // 空闲闭眼：整张脸压到很暗的横线，屏幕几乎全黑，减少 OLED 残影
    if (state.idleSleep) {
      expr = "dash";
      alpha = 0.16;
      inward = 0; gazeX = 0; gazeY = 0; mouthOpen = 0;
    }

    const squash = (blinkable && !state.idleSleep) ? blinkSquash(t) : 0;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(faceScale, faceScale);
    ctx.translate(-cx, -cy);

    const lx = cx - gap + inward;
    const rx = cx + gap - inward;

    drawEye(lx + gazeX, cy + gazeY, eyeR, expr, squash, alpha, t);
    drawEye(rx + gazeX, cy + gazeY, eyeR, expr, squash, alpha, t);

    // 嘴：眼和嘴的垂直距离 0.26s（ouo-face 校准值）
    const my = cy + s * 0.26;
    if (mouthOpen > 0.01) drawTalkingMouth(cx, my, mouthW, mouthOpen);
    else drawCatMouth(cx, my, mouthW, t);
    ctx.restore();

    // ---- 「我在」字幕：唤醒时出现；合成失败也照样显示 ----
    const nowMs = tms;
    const showCaption = (state.name === "waking" || nowMs < state.captionUntil)
      && state.name !== "error";
    if (showCaption) caption.textContent = state.ackText;
    caption.classList.toggle("on", showCaption && !state.offline);

    // ---- 连接提示：只有断线，不显示错误详情 ----
    notice.classList.toggle("on", state.offline);
    if (state.offline) notice.textContent = "与后端断开，正在重连…";
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
